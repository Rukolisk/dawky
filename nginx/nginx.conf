# nginx/nginx.conf — Dawky Production

events {
    worker_connections 1024;
}

http {
    # Paramètres généraux
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    client_max_body_size 10M;

    # ── Redirection HTTP → HTTPS ────────────────────────────────
    server {
        listen 80;
        server_name dawky.fr www.dawky.fr;

        # Nécessaire pour que Certbot prouve la propriété du domaine
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tout le reste → HTTPS
        location / {
            return 301 https://dawky.fr$request_uri;
        }
    }

    # ── HTTPS principal ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name dawky.fr www.dawky.fr;

        ssl_certificate     /etc/letsencrypt/live/dawky.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dawky.fr/privkey.pem;

        # Protocoles SSL modernes uniquement
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        # Sécurité headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy vers l'app Nuxt
        location / {
            proxy_pass         http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
