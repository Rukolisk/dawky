# nginx/nginx-init.conf
# Version SANS SSL — utilisée UNIQUEMENT lors de la première installation
# pour permettre à Certbot d'obtenir le certificat SSL initial.
# Après l'obtention du certificat, remplacez par nginx.conf

events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name dawky.fr www.dawky.fr;

        # Challenge Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Proxy temporaire vers l'app (en HTTP pendant l'init)
        location / {
            proxy_pass http://app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
