# docker-compose.yml — Dawky Production
# Première installation : docker compose up -d --build
# Mises à jour suivantes via GitHub Actions (image depuis registry)

services:

  app:
    # En prod avec GitHub Actions → utilise l'image du registry
    # Pour la 1ère install ou sans CI → on build localement
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NUXT_PUBLIC_SUPABASE_URL=${NUXT_PUBLIC_SUPABASE_URL}
        - NUXT_PUBLIC_SUPABASE_KEY=${NUXT_PUBLIC_SUPABASE_KEY}
    image: ghcr.io/rukolisk/dawky:latest
    container_name: dawky-app
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - dawky-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: dawky-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/dawky/certbot/conf:/etc/letsencrypt:ro
      - /opt/dawky/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - dawky-net

  certbot:
    image: certbot/certbot:latest
    container_name: dawky-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

networks:
  dawky-net:
    driver: bridge

volumes:
  certbot-certs:
  certbot-www:
