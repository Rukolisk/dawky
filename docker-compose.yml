# docker-compose.yml — Dawky Production
# Lancement : docker compose up -d

services:

  # ── Application Nuxt ────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_USERNAME}/dawky:latest
    container_name: dawky-app
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    networks:
      - dawky-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dawky-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dawky-net

  # ── Certbot — renouvellement SSL auto ───────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: dawky-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Vérifie le renouvellement toutes les 12h
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

networks:
  dawky-net:
    driver: bridge

volumes:
  certbot-certs:
  certbot-www:
